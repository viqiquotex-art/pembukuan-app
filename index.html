<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pembukuan — Keuangan Lebih Teratur</title>
  <style>
    /* =====================================================
       PEMBUKUAN — SOFT WHITE UI
       ===================================================== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    :root {
      --bg: #f1f2f4;
      --surface: #ffffff;
      --surface-soft: #f8f9fa;
      --text: #202124;
      --text-soft: #6f737b;
      --text-muted: #9aa0a8;
      --border: #e8e9ec;
      --primary: #252525;
      --primary-hover: #111111;
      --success: #35a66f;
      --danger: #e85b5b;
      --warning: #e7a93b;
      --info: #5b7cfa;
      --shadow-soft:
        8px 8px 20px rgba(0,0,0,0.06),
        -8px -8px 20px rgba(255,255,255,0.9);
      --shadow-card:
        0 8px 30px rgba(0,0,0,0.055);
      --shadow-small:
        0 3px 12px rgba(0,0,0,0.045);
      --radius-lg: 22px;
      --radius-md: 16px;
      --radius-sm: 12px;
    }
    html {
      scroll-behavior: smooth;
    }
    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    button,
    input,
    select,
    textarea {
      font-family: inherit;
    }
    button {
      -webkit-tap-highlight-color: transparent;
    }
    /* =====================================================
       CONTAINER
       ===================================================== */
    .container {
      width: 100%;
      max-width: 1180px;
      margin: 0 auto;
      padding: 28px 22px 60px;
    }
    /* =====================================================
       HEADER
       ===================================================== */
    .header {
      background: rgba(255,255,255,0.92);
      padding: 25px 28px;
      border-radius: var(--radius-lg);
      margin-bottom: 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      border: 1px solid rgba(255,255,255,0.8);
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .header-left h1 {
      font-size: 25px;
      font-weight: 750;
      letter-spacing: -0.5px;
      margin-bottom: 5px;
    }
    .header-left p {
      color: var(--text-soft);
      font-size: 13px;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    /* =====================================================
       CLOUD STATUS
       ===================================================== */
    .cloud-status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 9px 14px;
      background: var(--surface-soft);
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      box-shadow:
        inset 0 1px 2px rgba(0,0,0,0.025);
    }
    .cloud-status.connected {
      color: var(--success);
      background: #f1fbf6;
      border-color: #dcefe5;
    }
    /* =====================================================
       TABS
       ===================================================== */
    .tabs {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px;
      margin-bottom: 25px;
      background: rgba(255,255,255,0.72);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow-small);
      overflow-x: auto;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar {
      display: none;
    }
    .tab-btn {
      flex: 0 0 auto;
      padding: 10px 16px;
      background: transparent;
      border: none;
      border-radius: 11px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 650;
      color: var(--text-muted);
      transition:
        background 0.2s ease,
        color 0.2s ease,
        box-shadow 0.2s ease,
        transform 0.2s ease;
      white-space: nowrap;
    }
    .tab-btn:hover {
      color: var(--text);
      background: #f5f6f7;
    }
    .tab-btn.active {
      color: var(--text);
      background: white;
      box-shadow:
        0 3px 10px rgba(0,0,0,0.07);
      transform: translateY(-1px);
    }
    .tab-content {
      display: none;
      animation: fadeUp 0.25s ease;
    }
    .tab-content.active {
      display: block;
    }
    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(5px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    /* =====================================================
       FORM SECTION
       ===================================================== */
    .form-section {
      background: var(--surface);
      padding: 30px;
      border-radius: var(--radius-lg);
      border: 1px solid rgba(255,255,255,0.8);
      box-shadow: var(--shadow-card);
    }
    .form-section h2 {
      font-size: 19px !important;
      font-weight: 720;
      letter-spacing: -0.3px;
      margin-bottom: 25px !important;
    }
    .form-grid {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      margin-bottom: 18px;
    }
    label {
      font-size: 12px;
      font-weight: 650;
      color: var(--text-soft);
      margin-bottom: 7px;
    }
    input,
    select,
    textarea {
      width: 100%;
      padding: 12px 14px;
      background: #fafbfc;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 14px;
      outline: none;
      transition:
        border-color 0.2s ease,
        background 0.2s ease,
        box-shadow 0.2s ease;
    }
    input:hover,
    select:hover,
    textarea:hover {
      background: #ffffff;
    }
    input:focus,
    select:focus,
    textarea:focus {
      background: #ffffff;
      border-color: #c8cbd1;
      box-shadow:
        0 0 0 4px rgba(0,0,0,0.035);
    }
    textarea {
      resize: vertical;
      min-height: 95px;
    }
    input::placeholder,
    textarea::placeholder {
      color: #b0b3b8;
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    /* =====================================================
       BUTTONS
       ===================================================== */
    .btn {
      padding: 11px 18px;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 650;
      cursor: pointer;
      transition:
        transform 0.18s ease,
        box-shadow 0.18s ease,
        background 0.18s ease;
      box-shadow:
        0 3px 8px rgba(0,0,0,0.06);
    }
    .btn:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow:
        0 6px 15px rgba(0,0,0,0.09);
    }
    .btn:active:not(:disabled) {
      transform: translateY(0);
      box-shadow:
        0 2px 5px rgba(0,0,0,0.06);
    }
    .btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }
    .btn-primary {
      background: var(--primary);
      color: white;
    }
    .btn-primary:hover:not(:disabled) {
      background: var(--primary-hover);
    }
    .btn-info {
      background: #edf2ff;
      color: #4e6ee7;
    }
    .btn-success {
      background: #eaf8f0;
      color: #29915e;
    }
    .btn-danger {
      background: #fff0f0;
      color: #d94b4b;
    }
    .btn-small {
      padding: 7px 12px;
      font-size: 11px;
      border-radius: 9px;
    }
    /* =====================================================
       STAT CARDS
       ===================================================== */
    .stats-grid {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }
    .stat-card {
      position: relative;
      background: var(--surface);
      padding: 21px;
      border-radius: var(--radius-md);
      border: 1px solid rgba(255,255,255,0.9);
      box-shadow: var(--shadow-card);
      overflow: hidden;
    }
    .stat-card::after {
      content: "";
      position: absolute;
      width: 70px;
      height: 70px;
      right: -25px;
      top: -25px;
      border-radius: 50%;
      background: rgba(0,0,0,0.018);
    }
    .stat-card h3 {
      font-size: 11px;
      font-weight: 650;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.7px;
      margin-bottom: 8px;
    }
    .stat-card .amount {
      font-size: 25px;
      font-weight: 750;
      letter-spacing: -0.6px;
      margin-bottom: 3px;
    }
    .stat-card .detail {
      font-size: 11px;
      color: var(--text-muted);
    }
    .stat-card.income .amount {
      color: var(--success);
    }
    .stat-card.expense .amount {
      color: var(--danger);
    }
    .stat-card.balance .amount {
      color: var(--text);
    }
    /* =====================================================
       TRANSACTION LIST
       ===================================================== */
    .transaction-list {
      background: var(--surface);
      border-radius: var(--radius-lg);
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.9);
      box-shadow: var(--shadow-card);
    }
    .transaction-item {
      padding: 17px 19px;
      border-bottom: 1px solid #f0f1f3;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      transition:
        background 0.2s ease;
    }
    .transaction-item:last-child {
      border-bottom: none;
    }
    .transaction-item:hover {
      background: #fafbfc;
    }
    .transaction-info {
      flex: 1;
      min-width: 180px;
    }
    .transaction-category {
      font-size: 13px;
      font-weight: 680;
      color: var(--text);
      margin-bottom: 3px;
    }
    .transaction-desc {
      font-size: 12px;
      color: var(--text-soft);
    }
    .transaction-date {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 3px;
    }
    .transaction-amount {
      font-weight: 720;
      font-size: 14px;
      min-width: 110px;
      text-align: right;
    }
    .transaction-amount.income {
      color: var(--success);
    }
    .transaction-amount.expense {
      color: var(--danger);
    }
    .transaction-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    /* =====================================================
       MONTHLY RECAP
       ===================================================== */
    .recap-grid {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(280px, 1fr));
      gap: 17px;
    }
    .month-card {
      background: var(--surface);
      padding: 21px;
      border-radius: var(--radius-md);
      border: 1px solid rgba(255,255,255,0.9);
      box-shadow: var(--shadow-card);
    }
    .month-card h3 {
      font-size: 15px;
      font-weight: 720;
      margin-bottom: 15px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .recap-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 11px;
      font-size: 13px;
    }
    .recap-row .label {
      color: var(--text-muted);
    }
    .recap-row .value {
      font-weight: 650;
    }
    .recap-row.total {
      padding-top: 12px;
      border-top: 1px solid var(--border);
      font-size: 14px;
    }
    .recap-row.income .value {
      color: var(--success);
    }
    .recap-row.expense .value {
      color: var(--danger);
    }
    .recap-row.total .value {
      color: var(--text);
      font-weight: 750;
    }
    /* =====================================================
       CLOUD PANEL
       ===================================================== */
    .cloud-info {
      background: var(--surface);
      padding: 30px;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
      border: 1px solid rgba(255,255,255,0.9);
      position: relative;
      overflow: hidden;
    }
    .cloud-info::before {
      content: "";
      position: absolute;
      width: 180px;
      height: 180px;
      right: -80px;
      top: -90px;
      background: #f5f6f8;
      border-radius: 50%;
    }
    .cloud-info h3 {
      position: relative;
      font-size: 18px;
      font-weight: 720;
      margin-bottom: 7px;
    }
    .cloud-info p {
      position: relative;
      color: var(--text-soft);
      margin-bottom: 20px;
      font-size: 13px;
    }
    .cloud-actions {
      position: relative;
      display: flex;
      gap: 9px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .cloud-actions .btn {
      flex: 1;
      min-width: 145px;
    }
    .cloud-tips {
      position: relative;
      background: #f7f8fa;
      padding: 15px 17px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
    }
    .cloud-tips ul {
      list-style: none;
      padding: 0;
    }
    .cloud-tips li {
      margin-bottom: 7px;
      font-size: 12px;
      color: var(--text-soft);
    }
    .cloud-tips li:last-child {
      margin-bottom: 0;
    }
    /* =====================================================
       EMPTY STATE
       ===================================================== */
    .empty-state {
      text-align: center;
      padding: 65px 20px;
      color: var(--text-muted);
    }
    .empty-state h3 {
      font-size: 17px;
      margin-bottom: 7px;
      color: var(--text);
    }
    .empty-state p {
      font-size: 13px;
    }
    /* =====================================================
       EDIT MODE
       ===================================================== */
    .edit-mode-banner {
      background: #f3f6ff;
      border: 1px solid #dce4ff;
      border-radius: var(--radius-sm);
      padding: 12px 15px;
      margin-bottom: 17px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .edit-mode-banner p {
      font-size: 12px;
      color: var(--info);
      margin: 0;
    }
    .edit-mode-banner .btn {
      padding: 6px 11px;
      font-size: 11px;
    }
    /* =====================================================
       UTILITY
       ===================================================== */
    .mt-20 {
      margin-top: 20px;
    }
    .text-center {
      text-align: center;
    }
    /* =====================================================
       MOBILE
       ===================================================== */
    @media (max-width: 768px) {
      .container {
        padding: 15px 12px 40px;
      }
      .header {
        padding: 20px;
        border-radius: 18px;
        align-items: flex-start;
        flex-direction: column;
      }
      .header-left h1 {
        font-size: 21px;
      }
      .header-right {
        width: 100%;
      }
      .cloud-status {
        width: 100%;
        justify-content: center;
      }
      .tabs {
        margin-bottom: 18px;
        border-radius: 14px;
      }
      .tab-btn {
        padding: 9px 12px;
        font-size: 12px;
      }
      .form-section {
        padding: 21px 18px;
        border-radius: 18px;
      }
      .form-row {
        grid-template-columns: 1fr;
        gap: 0;
      }
      .stats-grid {
        grid-template-columns: 1fr 1fr;
        gap: 11px;
      }
      .stat-card {
        padding: 17px;
      }
      .stat-card .amount {
        font-size: 20px;
      }
      .transaction-item {
        align-items: flex-start;
        flex-wrap: wrap;
      }
      .transaction-amount {
        margin-left: auto;
        min-width: auto;
      }
      .transaction-actions {
        width: 100%;
      }
      .cloud-info {
        padding: 22px 18px;
        border-radius: 18px;
      }
      .cloud-actions {
        flex-direction: column;
      }
      .cloud-actions .btn {
        width: 100%;
      }
    }
    @media (max-width: 480px) {
      .stats-grid {
        grid-template-columns: 1fr;
      }
      .header-left h1 {
        font-size: 19px;
      }
      .form-section h2 {
        font-size: 17px !important;
      }
      .transaction-item {
        padding: 15px;
      }
    }
    /* =====================================================
       SCROLLBAR
       ===================================================== */
    ::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #d4d6da;
      border-radius: 99px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #bfc2c7;
    }
  </style>
</head>
<body>
  <div class="container">
<!-- ===================================================
     HEADER
     =================================================== -->
<div class="header">
  <div class="header-left">
    <h1>📊 Pembukuan Keuangan</h1>
    <p>
      Kelola pemasukan dan pengeluaran dengan lebih rapi.
    </p>
  </div>
  <div class="header-right">
    <div id="cloudStatusBadge" class="cloud-status">
      ⚫ Offline
    </div>
  </div>
</div>
<!-- ===================================================
     TABS
     =================================================== -->
<div class="tabs">
  <button
    class="tab-btn active"
    onclick="switchTab('input')"
  >
    ➕ Transaksi
  </button>
  <button
    class="tab-btn"
    onclick="switchTab('history')"
  >
    📋 Riwayat
  </button>
  <button
    class="tab-btn"
    onclick="switchTab('recap')"
  >
    📈 Rekap
  </button>
  <button
    class="tab-btn"
    onclick="switchTab('cloud')"
  >
    ☁️ Cloud
  </button>
</div>
<!-- ===================================================
     TAB INPUT
     =================================================== -->
<div id="input" class="tab-content active">
  <div
    id="editModeBanner"
    class="edit-mode-banner"
    style="display: none;"
  >
    <p>
      ✏️ Mode edit aktif — ubah data transaksi lalu simpan.
    </p>
    <button
      class="btn btn-small"
      onclick="cancelEdit()"
      style="background:#e9eaec;color:#555;"
    >
      Batal
    </button>
  </div>
  <div class="form-section">
    <h2 id="formTitle">
      Tambah Transaksi Baru
    </h2>
    <div class="form-row">
      <div class="form-group">
        <label>Tipe Transaksi</label>
        <select
          id="type"
          onchange="updateCategories()"
        >
          <option value="income">
            Pemasukan 💰
          </option>
          <option value="expense">
            Pengeluaran 💸
          </option>
        </select>
      </div>
      <div class="form-group">
        <label>Kategori</label>
        <select id="category"></select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Jumlah (Rp)</label>
        <input
          type="number"
          id="amount"
          placeholder="0"
          min="0"
          step="1000"
        >
      </div>
      <div class="form-group">
        <label>Tanggal</label>
        <input
          type="date"
          id="date"
        >
      </div>
    </div>
    <div class="form-group">
      <label>Keterangan</label>
      <textarea
        id="description"
        placeholder="Tuliskan detail transaksi..."
      ></textarea>
    </div>
    <div
      style="
        display:flex;
        gap:10px;
        margin-top:5px;
      "
    >
      <button
        class="btn btn-primary"
        id="submitBtn"
        onclick="addTransaction()"
        style="flex:1;padding:14px;"
      >
        Simpan Transaksi
      </button>
      <button
        class="btn"
        id="cancelBtn"
        onclick="cancelEdit()"
        style="
          flex:1;
          padding:14px;
          background:#f0f1f3;
          color:#555;
          display:none;
        "
      >
        Batal Edit
      </button>
    </div>
  </div>
</div>
<!-- ===================================================
     TAB RIWAYAT
     =================================================== -->
<div id="history" class="tab-content">
  <div style="margin-bottom:25px;">
    <h2
      style="
        margin-bottom:16px;
        font-size:18px;
        font-weight:720;
      "
    >
      Ringkasan Hari Ini
    </h2>
    <div
      class="stats-grid"
      id="todayStats"
    ></div>
  </div>
  <div>
    <h2
      style="
        margin-bottom:16px;
        font-size:18px;
        font-weight:720;
      "
    >
      Transaksi Terbaru
    </h2>
    <div
      id="transactionList"
      class="transaction-list"
    ></div>
  </div>
</div>
<!-- ===================================================
     TAB REKAP
     =================================================== -->
<div id="recap" class="tab-content">
  <div style="margin-bottom:20px;">
    <h2
      style="
        margin-bottom:16px;
        font-size:18px;
        font-weight:720;
      "
    >
      Rekap Bulanan
    </h2>
    <div
      class="recap-grid"
      id="recapGrid"
    ></div>
  </div>
</div>
<!-- ===================================================
     TAB CLOUD
     =================================================== -->
<div id="cloud" class="tab-content">
  <div id="cloudPanel"></div>
</div>
  </div>
  <!-- APP JAVASCRIPT -->
  <script src="app.js"></script>
</body>
</html>
