<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pembukuan - Pemasukan & Pengeluaran</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #6d5dfc;
      --primary-light: #8b7cff;
      --success: #45a86b;
      --danger: #ef4444;
      --warning: #f59e0b;
      --info: #3b82f6;
      --bg: #f3f4f6;
      --surface: #ffffff;
      --text: #202124;
      --muted: #858991;
      --border: #e5e7eb;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    /* ========== HEADER ========== */
    .header {
      background: var(--surface);
      padding: 25px;
      border-radius: 12px;
      margin-bottom: 30px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
    }

    .header-left h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .header-left p {
      color: var(--muted);
      font-size: 14px;
    }

    .header-right {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .cloud-status {
      font-size: 12px;
      color: var(--muted);
      padding: 8px 12px;
      background: #f3f4f6;
      border-radius: 6px;
    }

    .cloud-status.connected {
      color: var(--success);
      background: rgba(69, 168, 107, 0.1);
    }

    /* ========== TABS ========== */
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
      border-bottom: 2px solid var(--border);
      overflow-x: auto;
    }

    .tab-btn {
      padding: 12px 20px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      color: var(--muted);
      border-bottom: 3px solid transparent;
      transition: all 0.3s ease;
      margin-bottom: -2px;
      white-space: nowrap;
    }

    .tab-btn.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* ========== FORM ========== */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    label {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text);
    }

    input, select, textarea {
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      transition: border-color 0.2s ease;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(109, 93, 252, 0.1);
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    /* ========== BUTTONS ========== */
    .btn {
      padding: 11px 20px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--primary-light);
      transform: translateY(-1px);
    }

    .btn-info {
      background: var(--info);
      color: white;
    }

    .btn-info:hover:not(:disabled) {
      background: #2563eb;
    }

    .btn-danger {
      background: var(--danger);
      color: white;
    }

    .btn-danger:hover:not(:disabled) {
      background: #dc2626;
    }

    .btn-success {
      background: var(--success);
      color: white;
    }

    .btn-success:hover:not(:disabled) {
      background: #399660;
    }

    .btn-small {
      padding: 6px 12px;
      font-size: 12px;
    }

    /* ========== CARDS ========== */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: var(--surface);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .stat-card h3 {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }

    .stat-card .amount {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .stat-card .detail {
      font-size: 12px;
      color: var(--muted);
    }

    .stat-card.income .amount {
      color: var(--success);
    }

    .stat-card.expense .amount {
      color: var(--danger);
    }

    .stat-card.balance .amount {
      color: var(--primary);
    }

    /* ========== TRANSACTION LIST ========== */
    .transaction-list {
      background: var(--surface);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .transaction-item {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.2s ease;
      gap: 10px;
      flex-wrap: wrap;
    }

    .transaction-item:last-child {
      border-bottom: none;
    }

    .transaction-item:hover {
      background: #f9fafb;
    }

    .transaction-info {
      flex: 1;
      min-width: 200px;
    }

    .transaction-category {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 4px;
    }

    .transaction-desc {
      font-size: 13px;
      color: var(--muted);
    }

    .transaction-date {
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
    }

    .transaction-amount {
      font-weight: 700;
      font-size: 16px;
      min-width: 100px;
      text-align: right;
    }

    .transaction-amount.income {
      color: var(--success);
    }

    .transaction-amount.expense {
      color: var(--danger);
    }

    .transaction-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* ========== MONTHLY RECAP ========== */
    .recap-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }

    .month-card {
      background: var(--surface);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .month-card h3 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--border);
    }

    .recap-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
      font-size: 14px;
    }

    .recap-row .label {
      color: var(--muted);
    }

    .recap-row .value {
      font-weight: 600;
    }

    .recap-row.total {
      padding-top: 12px;
      border-top: 1px solid var(--border);
      font-size: 15px;
    }

    .recap-row.income .value {
      color: var(--success);
    }

    .recap-row.expense .value {
      color: var(--danger);
    }

    .recap-row.total .value {
      color: var(--primary);
      font-weight: 700;
    }

    /* ========== CLOUD PANEL ========== */
    .cloud-info {
      background: var(--surface);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      border-left: 4px solid var(--info);
    }

    .cloud-info h3 {
      font-size: 18px;
      margin-bottom: 10px;
      color: var(--text);
    }

    .cloud-info p {
      color: var(--muted);
      margin-bottom: 20px;
      font-size: 14px;
    }

    .cloud-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .cloud-actions .btn {
      flex: 1;
      min-width: 150px;
    }

    .cloud-tips {
      background: rgba(59, 130, 246, 0.05);
      padding: 15px;
      border-radius: 8px;
      border-left: 3px solid var(--info);
    }

    .cloud-tips ul {
      list-style: none;
      padding: 0;
    }

    .cloud-tips li {
      margin-bottom: 8px;
      font-size: 13px;
      color: var(--muted);
    }

    .cloud-tips li:last-child {
      margin-bottom: 0;
    }

    /* ========== EMPTY STATE ========== */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }

    .empty-state h3 {
      font-size: 18px;
      margin-bottom: 10px;
      color: var(--text);
    }

    /* ========== EDIT MODE ========== */
    .edit-mode-banner {
      background: rgba(59, 130, 246, 0.1);
      border: 1px solid var(--info);
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .edit-mode-banner p {
      font-size: 14px;
      color: var(--info);
      margin: 0;
    }

    .edit-mode-banner .btn {
      padding: 6px 12px;
      font-size: 12px;
    }

    /* ========== RESPONSIVE ========== */
    @media (max-width: 768px) {
      .header {
        flex-direction: column;
        align-items: flex-start;
      }

      .header-right {
        width: 100%;
        flex-direction: column;
      }

      .form-row {
        grid-template-columns: 1fr;
      }

      .transaction-item {
        flex-direction: column;
        align-items: flex-start;
      }

      .transaction-amount {
        align-self: flex-end;
        margin-top: 10px;
      }

      .stats-grid {
        grid-template-columns: 1fr;
      }

      .tabs {
        flex-wrap: nowrap;
        overflow-x: auto;
      }

      .cloud-actions .btn {
        min-width: 120px;
      }
    }

    @media (max-width: 600px) {
      .container {
        padding: 10px;
      }

      .header {
        padding: 15px;
      }

      .header-left h1 {
        font-size: 22px;
      }

      .transaction-actions {
        width: 100%;
        justify-content: flex-start;
      }

      .cloud-actions {
        flex-direction: column;
      }

      .cloud-actions .btn {
        width: 100%;
      }
    }

    /* ========== UTILITY ========== */
    .mt-20 {
      margin-top: 20px;
    }

    .text-center {
      text-align: center;
    }

    .form-section {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
  </style>
</head>
<body>

<div class="container">
  <!-- HEADER -->
  <div class="header">
    <div class="header-left">
      <h1>📊 Pembukuan Keuangan</h1>
      <p>Kelola pemasukan dan pengeluaran dengan mudah</p>
    </div>
    <div class="header-right">
      <div id="cloudStatusBadge" class="cloud-status">
        ⚫ Offline
      </div>
    </div>
  </div>

  <!-- TABS -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('input')">➕ Input Transaksi</button>
    <button class="tab-btn" onclick="switchTab('history')">📋 Riwayat</button>
    <button class="tab-btn" onclick="switchTab('recap')">📈 Rekap Bulanan</button>
    <button class="tab-btn" onclick="switchTab('cloud')">☁️ Cloud Storage</button>
  </div>

  <!-- ========== TAB 1: INPUT TRANSAKSI ========== -->
  <div id="input" class="tab-content active">
    <div id="editModeBanner" class="edit-mode-banner" style="display: none;">
      <p>✏️ Mode edit aktif - ubah data transaksi dan klik Simpan untuk update</p>
      <button class="btn btn-small" onclick="cancelEdit()" style="background: var(--muted);">Batal</button>
    </div>

    <div class="form-section">
      <h2 style="margin-bottom: 25px; font-size: 20px;" id="formTitle">Tambah Transaksi Baru</h2>
      
      <div class="form-row">
        <div class="form-group">
          <label>Tipe Transaksi</label>
          <select id="type" onchange="updateCategories()">
            <option value="income">Pemasukan 💰</option>
            <option value="expense">Pengeluaran 💸</option>
          </select>
        </div>
        <div class="form-group">
          <label>Kategori</label>
          <select id="category"></select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Jumlah (Rp)</label>
          <input type="number" id="amount" placeholder="0" min="0" step="1000">
        </div>
        <div class="form-group">
          <label>Tanggal</label>
          <input type="date" id="date">
        </div>
      </div>

      <div class="form-group">
        <label>Keterangan</label>
        <textarea id="description" placeholder="Tuliskan detail transaksi..."></textarea>
      </div>

      <div style="display: flex; gap: 10px; margin-top: 20px;">
        <button class="btn btn-primary" id="submitBtn" onclick="addTransaction()" style="flex: 1; padding: 14px;">Simpan Transaksi</button>
        <button class="btn" id="cancelBtn" onclick="cancelEdit()" style="flex: 1; padding: 14px; background: var(--border); color: var(--text); display: none;">Batal Edit</button>
      </div>
    </div>
  </div>

  <!-- ========== TAB 2: RIWAYAT ========== -->
  <div id="history" class="tab-content">
    <div style="margin-bottom: 20px;">
      <h2 style="margin-bottom: 20px; font-size: 20px;">Ringkasan Hari Ini</h2>
      <div class="stats-grid" id="todayStats"></div>
    </div>

    <div>
      <h2 style="margin-bottom: 20px; font-size: 20px;">Transaksi Terbaru</h2>
      <div id="transactionList" class="transaction-list"></div>
    </div>
  </div>

  <!-- ========== TAB 3: REKAP BULANAN ========== -->
  <div id="recap" class="tab-content">
    <div style="margin-bottom: 20px;">
      <h2 style="margin-bottom: 20px; font-size: 20px;">Rekap Bulanan</h2>
      <div class="recap-grid" id="recapGrid"></div>
    </div>
  </div>

  <!-- ========== TAB 4: CLOUD STORAGE ========== -->
  <div id="cloud" class="tab-content">
    <div id="cloudPanel"></div>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
