<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pembukuan Keuangan</title>
  <!-- External CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <!-- =====================================================
         HEADER
         ===================================================== -->
    <header class="header">
      <div class="header-left">
        <h1>📊 Pembukuan Keuangan</h1>
        <p>Kelola pemasukan dan pengeluaran dengan mudah</p>
      </div>
      <div class="header-right">
        <div id="cloudStatusBadge" class="cloud-status">
          ⚫ Offline
        </div>
      </div>
    </header>
    <!-- =====================================================
         NAVIGATION TABS
         ===================================================== -->
    <nav class="tabs">
      <button
        class="tab-btn active"
        onclick="switchTab('input')"
      >
        ➕ Input Transaksi
      </button>
      <button
        class="tab-btn"
        onclick="switchTab('history')"
      >
        📋 Riwayat
      </button>
      <button
        class="tab-btn"
        onclick="switchTab('recap')"
      >
        📈 Rekap Bulanan
      </button>
      <button
        class="tab-btn"
        onclick="switchTab('cloud')"
      >
        ☁️ Cloud Storage
      </button>
    </nav>
    <!-- =====================================================
         ALERT GLOBAL
         ===================================================== -->
    <div
      id="alert"
      class="alert"
    ></div>
    <!-- =====================================================
         TAB 1
         INPUT TRANSAKSI
         ===================================================== -->
    <section
      id="input"
      class="tab-content active"
    >
      <!-- EDIT MODE -->
      <div
        id="editModeBanner"
        class="edit-mode-banner"
        style="display: none;"
      >
        <p>
          ✏️ Mode edit aktif - ubah data transaksi dan klik Simpan untuk update
        </p>
        <button
          class="btn btn-small"
          onclick="cancelEdit()"
        >
          Batal
        </button>
      </div>
      <!-- FORM -->
      <div class="form-section">
        <h2
          id="formTitle"
          style="margin-bottom: 25px;"
        >
          Tambah Transaksi Baru
        </h2>
        <!-- TYPE + CATEGORY -->
        <div class="form-row">
          <div class="form-group">
            <label for="type">
              Tipe Transaksi
            </label>
            <select
              id="type"
              onchange="updateCategories()"
            >
              <option value="income">
                Pemasukan 💰
              </option>
              <option value="expense">
                Pengeluaran 💸
              </option>
            </select>
          </div>
          <div class="form-group">
            <label for="category">
              Kategori
            </label>
            <select id="category"></select>
          </div>
        </div>
        <!-- AMOUNT + DATE -->
        <div class="form-row">
          <div class="form-group">
            <label for="amount">
              Jumlah (Rp)
            </label>
            <input
              type="number"
              id="amount"
              placeholder="0"
              min="0"
              step="1000"
            >
          </div>
          <div class="form-group">
            <label for="date">
              Tanggal
            </label>
            <input
              type="date"
              id="date"
            >
          </div>
        </div>
        <!-- DESCRIPTION -->
        <div class="form-group">
          <label for="description">
            Keterangan
          </label>
          <textarea
            id="description"
            placeholder="Tuliskan detail transaksi..."
          ></textarea>
        </div>
        <!-- LOADING -->
        <div
          id="saveLoading"
          class="loading"
        >
          <span class="spinner"></span>
          Menyimpan transaksi...
        </div>
        <!-- BUTTON -->
        <div
          style="
            display: flex;
            gap: 10px;
            margin-top: 20px;
          "
        >
          <button
            class="btn btn-primary"
            id="submitBtn"
            onclick="addTransaction()"
            style="flex: 1; padding: 14px;"
          >
            Simpan Transaksi
          </button>
          <button
            class="btn"
            id="cancelBtn"
            onclick="cancelEdit()"
            style="
              flex: 1;
              padding: 14px;
              background: var(--border);
              color: var(--text);
              display: none;
            "
          >
            Batal Edit
          </button>
        </div>
      </div>
    </section>
    <!-- =====================================================
         TAB 2
         RIWAYAT
         ===================================================== -->
    <section
      id="history"
      class="tab-content"
    >
      <!-- TODAY SUMMARY -->
      <div style="margin-bottom: 20px;">
        <h2
          style="
            margin-bottom: 20px;
            font-size: 20px;
          "
        >
          Ringkasan Hari Ini
        </h2>
        <div
          class="stats-grid"
          id="todayStats"
        ></div>
      </div>
      <!-- TRANSACTION HISTORY -->
      <div>
        <h2
          style="
            margin-bottom: 20px;
            font-size: 20px;
          "
        >
          Transaksi Terbaru
        </h2>
        <div
          id="transactionList"
          class="transaction-list"
        ></div>
      </div>
    </section>
    <!-- =====================================================
         TAB 3
         REKAP BULANAN
         ===================================================== -->
    <section
      id="recap"
      class="tab-content"
    >
      <div style="margin-bottom: 20px;">
        <h2
          style="
            margin-bottom: 20px;
            font-size: 20px;
          "
        >
          Rekap Bulanan
        </h2>
        <div
          class="recap-grid"
          id="recapGrid"
        ></div>
      </div>
    </section>
    <!-- =====================================================
         TAB 4
         CLOUD STORAGE
         ===================================================== -->
    <section
      id="cloud"
      class="tab-content"
    >
      <div id="cloudPanel"></div>
    </section>
  </div>
  <!-- =====================================================
       JAVASCRIPT
       ===================================================== -->
  <script src="app.js"></script>
</body>
</html>
