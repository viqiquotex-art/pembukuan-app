<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pembukuan App</title>
  <!-- Main UI -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
<!-- =====================================================
     APP HEADER
     ===================================================== -->
<header class="header">
  <div class="header-left">
    <h1>📊 Pembukuan Keuangan</h1>
    <p>Kelola pemasukan dan pengeluaran dengan mudah</p>
  </div>
  <div class="header-right">
    <div id="cloudStatusBadge" class="cloud-status">
      ⚫ Offline
    </div>
  </div>
</header>
<!-- =====================================================
     APP NAVIGATION
     ===================================================== -->
<nav class="tabs">
  <button
    class="tab-btn active"
    onclick="switchTab('input')"
    type="button"
  >
    ➕ Input Transaksi
  </button>
  <button
    class="tab-btn"
    onclick="switchTab('history')"
    type="button"
  >
    📋 Riwayat
  </button>
  <button
    class="tab-btn"
    onclick="switchTab('recap')"
    type="button"
  >
    📈 Rekap Bulanan
  </button>
  <button
    class="tab-btn"
    onclick="switchTab('cloud')"
    type="button"
  >
    ☁️ Cloud Storage
  </button>
</nav>
<!-- =====================================================
     TAB 1 — INPUT TRANSAKSI
     ===================================================== -->
<main>
  <section
    id="input"
    class="tab-content active"
  >
    <!-- EDIT MODE -->
    <div
      id="editModeBanner"
      class="edit-mode-banner"
      style="display: none;"
    >
      <p>
        ✏️ Mode edit aktif — ubah data transaksi lalu simpan.
      </p>
      <button
        class="btn btn-small"
        onclick="cancelEdit()"
        type="button"
        style="background: var(--muted); color: white;"
      >
        Batal
      </button>
    </div>
    <!-- FORM -->
    <div class="form-section">
      <h2 id="formTitle">
        Tambah Transaksi Baru
      </h2>
      <!-- TYPE + CATEGORY -->
      <div class="form-row">
        <div class="form-group">
          <label for="type">
            Tipe Transaksi
          </label>
          <select
            id="type"
            onchange="updateCategories()"
          >
            <option value="income">
              Pemasukan 💰
            </option>
            <option value="expense">
              Pengeluaran 💸
            </option>
          </select>
        </div>
        <div class="form-group">
          <label for="category">
            Kategori
          </label>
          <select id="category"></select>
        </div>
      </div>
      <!-- AMOUNT + DATE -->
      <div class="form-row">
        <div class="form-group">
          <label for="amount">
            Jumlah (Rp)
          </label>
          <input
            type="number"
            id="amount"
            placeholder="0"
            min="0"
            step="1000"
          >
        </div>
        <div class="form-group">
          <label for="date">
            Tanggal
          </label>
          <input
            type="date"
            id="date"
          >
        </div>
      </div>
      <!-- DESCRIPTION -->
      <div class="form-group">
        <label for="description">
          Keterangan
        </label>
        <textarea
          id="description"
          placeholder="Tuliskan detail transaksi..."
        ></textarea>
      </div>
      <!-- ACTION -->
      <div
        style="
          display: flex;
          gap: 10px;
          margin-top: 20px;
        "
      >
        <button
          class="btn btn-primary"
          id="submitBtn"
          onclick="addTransaction()"
          type="button"
          style="flex: 1; padding: 14px;"
        >
          Simpan Transaksi
        </button>
        <button
          class="btn"
          id="cancelBtn"
          onclick="cancelEdit()"
          type="button"
          style="
            flex: 1;
            padding: 14px;
            background: var(--border);
            color: var(--text);
            display: none;
          "
        >
          Batal Edit
        </button>
      </div>
    </div>
  </section>
  <!-- =====================================================
       TAB 2 — RIWAYAT
       ===================================================== -->
  <section
    id="history"
    class="tab-content"
  >
    <!-- TODAY -->
    <div style="margin-bottom: 20px;">
      <h2 style="margin-bottom: 20px;">
        Ringkasan Hari Ini
      </h2>
      <div
        class="stats-grid"
        id="todayStats"
      ></div>
    </div>
    <!-- TRANSACTION HISTORY -->
    <div>
      <h2 style="margin-bottom: 20px;">
        Transaksi Terbaru
      </h2>
      <div
        id="transactionList"
        class="transaction-list"
      ></div>
    </div>
  </section>
  <!-- =====================================================
       TAB 3 — REKAP BULANAN
       ===================================================== -->
  <section
    id="recap"
    class="tab-content"
  >
    <div style="margin-bottom: 20px;">
      <h2 style="margin-bottom: 20px;">
        Rekap Bulanan
      </h2>
      <div
        id="recapGrid"
        class="recap-grid"
      ></div>
    </div>
  </section>
  <!-- =====================================================
       TAB 4 — CLOUD STORAGE
       ===================================================== -->
  <section
    id="cloud"
    class="tab-content"
  >
    <div id="cloudPanel"></div>
  </section>
</main>
  </div>
  <!-- =======================================================
       APPLICATION LOGIC
       ======================================================= -->
  <script src="app.js"></script>
</body>
</html>
