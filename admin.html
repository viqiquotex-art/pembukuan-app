<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXA Admin</title>
  <style>
    :root{--purple:#7c3aed;--purple2:#a855f7;--ink:#211b32;--muted:#766d86;--line:#ece7f4;--bg:#f7f5fb;--card:#fff;--green:#16a34a;--red:#dc2626}
    *{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:linear-gradient(135deg,#faf9ff 0%,#f3effb 100%);min-height:100vh}
    .shell{max-width:1180px;margin:auto;padding:28px 20px 40px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:28px}.brand{display:flex;align-items:center;gap:12px}.logo{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,var(--purple),var(--purple2));color:white;display:grid;place-items:center;font-size:24px;font-weight:800;box-shadow:0 10px 25px #7c3aed35}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--purple)}h1{font-size:25px;margin:2px 0 0}button,a{font:inherit}.back{border:1px solid var(--line);background:#fff;color:var(--ink);padding:10px 15px;border-radius:11px;text-decoration:none;font-weight:700}.hero{margin-bottom:22px}.hero h2{margin:0 0 6px;font-size:29px}.hero p{margin:0;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:22px}.card{background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 12px 35px #33215d0b}.stat-label{color:var(--muted);font-size:13px;font-weight:700}.stat-value{font-size:30px;font-weight:800;margin-top:8px}.panel{overflow:hidden}.panel-head{padding:20px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}.panel-title{font-size:17px;font-weight:800}.refresh{border:0;background:#f1eaff;color:var(--purple);padding:9px 13px;border-radius:10px;font-weight:800;cursor:pointer}.status{padding:16px 22px;color:var(--muted);font-size:14px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:720px}th,td{text-align:left;padding:15px 22px;border-bottom:1px solid var(--line);font-size:14px}th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:#fbfaff}tbody tr:hover{background:#fcfaff}.name{font-weight:750}.email{color:var(--muted)}.badge{display:inline-flex;padding:5px 9px;border-radius:999px;background:#ecfdf3;color:var(--green);font-size:12px;font-weight:800}.error{color:var(--red);background:#fff1f2;border-radius:12px;padding:13px 15px;margin:16px 22px}.empty{padding:45px;text-align:center;color:var(--muted)}footer{text-align:center;color:var(--muted);font-size:12px;margin-top:24px}
    @media(max-width:700px){.shell{padding:20px 14px}.top{align-items:flex-start}.stats{grid-template-columns:1fr}.hero h2{font-size:24px}.back{padding:8px 11px;font-size:13px}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top">
      <div class="brand"><div class="logo">N</div><div><div class="eyebrow">NEXA Admin</div><h1>Admin Dashboard</h1></div></div>
      <a class="back" href="index.html">← Kembali ke NEXA</a>
    </header>
    <section class="hero"><h2>Manajemen Pengguna</h2><p>Pantau pengguna yang sudah terdaftar di NEXA.</p></section>
    <section class="stats">
      <div class="card"><div class="stat-label">TOTAL USER</div><div class="stat-value" id="totalUsers">—</div></div>
      <div class="card"><div class="stat-label">USER TERBARU</div><div class="stat-value" id="latestUser">—</div></div>
      <div class="card"><div class="stat-label">STATUS ADMIN</div><div class="stat-value" style="font-size:22px">● Aktif</div></div>
    </section>
    <section class="card panel">
      <div class="panel-head"><div class="panel-title">Daftar Pengguna</div><button class="refresh" onclick="loadUsers()">↻ Refresh</button></div>
      <div id="message" class="status">Memuat data pengguna…</div>
      <div class="table-wrap"><table><thead><tr><th>Nama</th><th>Email</th><th>Tanggal Daftar</th><th>Login Terakhir</th><th>Status</th></tr></thead><tbody id="usersBody"></tbody></table></div>
    </section>
    <footer>NEXA • Asisten Pembukuan Keuangan • Admin</footer>
  </main>
  <script src="admin.js"></script>
</body>
</html>
